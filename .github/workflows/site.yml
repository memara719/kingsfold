# Rebuilds the website on every push to main and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/kingsfold/
name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Isotopia: a pygame game, packaged for the browser with pygbag, served at /isotopia/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygame-ce==2.5.8 pygbag==0.9.3
      - run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python test/test_isotopia.py
      - run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python test/isotopia_play.py
      - run: python -m pygbag --build --title Isotopia isotopia
      - run: cp -r isotopia/build/web site/isotopia
      - name: Publish site/ to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
